# Checks every pull request and every push to main. A green run on main is what triggers the deploy
# (.github/workflows/deploy.yml). Same commands as local development (backend/README.md, docs/mantenimiento.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # The database tests create and drop their own databases on this throwaway server.
      TEST_DATABASE_URL: postgresql+asyncpg://radar:radar@localhost:5432/radar_test
      TEST_API_DATABASE_URL: postgresql+asyncpg://radar:radar@localhost:5432/radar_test_api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked # installs the Python of backend/.python-version (3.13)
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q

  web:
    name: Web (types, lint, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx next typegen # route types (LayoutProps, PageProps) that tsc needs before a build
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  # Playwright against the whole app with seeded data (e2e/README.md, ADR 0038). On the runner without Docker images:
  # a Postgres service, the API with uv and the production build of the web (`next build` + its standalone server),
  # because the uv, npm, Next and browser caches make that faster than building both images on every run, and there
  # is one way to start each process, with logs kept for the report. Locally the same suite runs on the compose stack.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # API (and backend/tests/e2e_seed.py, which empties this throwaway database only when RADAR_E2E=1)
      DATABASE_URL: postgresql+asyncpg://radar:radar@localhost:5432/radar
      RADAR_PUBLIC_URL: http://localhost:3090
      RADAR_E2E: "1"
      # Shows the seeded «Revisión por IA» verdicts; not a key: nothing ingests here, nothing is sent to Google.
      GEMINI_API_KEY: e2e-not-a-key
      # Web: the API address baked into the /api/* rewrites at build time, and read by server components
      API_URL: http://127.0.0.1:8090
      # Playwright (playwright.config.ts, e2e/global-setup.ts)
      E2E_BASE_URL: http://localhost:3090
      E2E_BACKEND: uv run --directory backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --locked --directory backend
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-e2e-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: next-e2e-${{ hashFiles('package-lock.json') }}-
      - name: Build the web
        run: |
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = true ]; then npx playwright install-deps chromium
          else npx playwright install --with-deps chromium; fi
      - name: Start the API and the web
        run: |
          (cd backend && uv run alembic upgrade head)
          (cd backend && nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8090 > "$RUNNER_TEMP/api.log" 2>&1 &)
          PORT=3090 HOSTNAME=0.0.0.0 nohup node .next/standalone/server.js > "$RUNNER_TEMP/web.log" 2>&1 &
          for url in http://127.0.0.1:8090/health http://localhost:3090/login; do
            curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null "$url" || { cat "$RUNNER_TEMP"/*.log; exit 1; }
          done
      - run: npx playwright test
      - name: Keep the server logs with the report
        if: failure()
        run: cp "$RUNNER_TEMP"/api.log "$RUNNER_TEMP"/web.log playwright-report/ || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
