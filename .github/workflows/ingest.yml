name: Ingest

# Fetches every source and writes the result to Postgres (scripts/ingest.ts). See docs/backend.md.
# Without the DATABASE_URL secret every job is a successful no-op, so this file can be pushed before
# the database exists.

on:
  schedule:
    # Cron is UTC. These match 06:00, 13:00 and 19:00 Europe/Madrid in winter (CET, UTC+1).
    # DST caveat: in summer (CEST, UTC+2) they run one hour later, at 07:00, 14:00 and 20:00 Madrid time.
    - cron: "0 5 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
    # Nightly backup only (03:00 Madrid in winter).
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to run, comma-separated (e.g. bdns,boe). Empty = all."
        required: false
        default: ""

# Never two ingests (or an ingest and a backup) at the same time; a queued run waits.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '0 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret is not set: skipping ingest (no-op). See docs/backend.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.cfg.outputs.enabled == 'true'
      - name: Ingest
        if: steps.cfg.outputs.enabled == 'true'
        env:
          INGEST_TRIGGER: ${{ github.event_name }}
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          if [ -n "$SOURCES" ]; then
            npx tsx scripts/ingest.ts --source "$SOURCES"
          else
            npx tsx scripts/ingest.ts
          fi

  # STOPGAP until an off-site bucket is configured: Supabase Free has no automatic backups, so dump the
  # database every night to a workflow artifact kept for 7 days. Artifacts live in GitHub, not off-site,
  # and expire: replace with an upload to object storage (S3/R2/B2) as soon as one exists.
  backup:
    if: github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret is not set: skipping backup (no-op)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pg_dump 17 (must be >= the server's major version)
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Dump
        if: steps.cfg.outputs.enabled == 'true'
        # Needs a session-mode or direct connection string (the transaction pooler does not support pg_dump).
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges \
            --schema=public --file="radar-$(date -u +%Y%m%dT%H%MZ).dump"
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          name: radar-db-backup
          path: radar-*.dump
          retention-days: 7
