# Production overlay, deployed by Dokploy (docs/despliegue.md, ADR 0039). The Dokploy compose app runs, in its own
# checkout of this repository, the custom command deploy/deploy.sh sets (`dokploy_command` there; ADR 0044):
#   docker compose -p <app name> -f docker-compose.yml -f docker-compose.prod.yml build && … up (rollout of api and web)
# (<app name>: the one Dokploy gave the app, e.g. reforesta-radar-prod-fb9o1w; also COMPOSE_PROJECT_NAME), with the
# .env Dokploy writes from the app's environment: RADAR_DOMAIN and RADAR_DB_PASSWORD (never in git); optionally
# GEMINI_API_KEY for the «Revisión por IA» (ADR 0041).
# Dokploy's Traefik terminates https and reaches only `web`, over the external network `reforesta-radar-edge`
# (created by deploy/setup-server.sh, Traefik attached). No service publishes a port.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-prod-env: &prod-env
  RADAR_PUBLIC_URL: https://${RADAR_DOMAIN:?set RADAR_DOMAIN in the Dokploy environment}
  RADAR_COOKIE_SECURE: "true"
  CORS_ORIGINS: https://${RADAR_DOMAIN}
  # Traefik replaces any client X-Forwarded-For with the peer address, Next passes it on, and only `web` and the
  # other services of this project sit on this subnet: the API trusts it (and nothing else).
  FORWARDED_ALLOW_IPS: ${RADAR_NET_SUBNET:-172.28.90.0/24}
  # «Revisión por IA» (ADR 0041, docs/despliegue.md): set in the Dokploy environment, never here. No key = off.
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  RADAR_AI_REVIEW: ${RADAR_AI_REVIEW:-true}
  RADAR_AI_MODEL: ${RADAR_AI_MODEL:-gemini-flash-lite-latest}
  RADAR_AI_MAX_CALLS: ${RADAR_AI_MAX_CALLS:-300}

# Memory caps so another project on the same machine cannot starve the radar (and the radar cannot starve it).
# Measured idle: 50-100 MB per service. The ingest (scheduler, or a manual `ingest` run) is the hungry one.
x-limits: &limits-small
  resources:
    limits: { memory: 768m }
    reservations: { memory: 128m }
x-limits-backend: &limits-backend
  resources:
    limits: { memory: 1g }
    reservations: { memory: 256m }
x-limits-ingest: &limits-ingest
  resources:
    limits: { memory: 1536m }
    reservations: { memory: 256m }

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${RADAR_DB_PASSWORD:?set RADAR_DB_PASSWORD in the Dokploy environment}
    ports: !reset []
    restart: unless-stopped
    deploy: *limits-backend
    logging: *logging

  # One image per service, rebuilt on every deploy from the checked-out commit (Dokploy's command, set by
  # deploy/deploy.sh). `api` and `web` are rolled out without downtime (ADR 0044): a second container of each starts
  # from the new images, and the old one is removed only once the new one is healthy. Both versions serve side by
  # side for a few seconds, on the same database: migrations must keep the previous release working.
  api:
    image: ${COMPOSE_PROJECT_NAME}-backend:prod
    environment:
      <<: *prod-env
    ports: !reset []
    healthcheck:
      start_period: 30s
      start_interval: 2s # healthy (and so in rotation for the rollout) within seconds of starting
    stop_grace_period: 30s # uvicorn finishes the requests in flight (a PDF analysis can take a while)
    deploy: *limits-backend
    logging: *logging

  ingest:
    image: ${COMPOSE_PROJECT_NAME}-backend:prod
    environment:
      <<: *prod-env
    deploy: *limits-ingest
    logging: *logging

  ingest-scheduler:
    image: ${COMPOSE_PROJECT_NAME}-backend:prod
    environment:
      <<: *prod-env
    healthcheck:
      # The scheduler is a loop; check it can still reach the database.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('postgres', 5432), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy: *limits-ingest
    logging: *logging

  web:
    image: ${COMPOSE_PROJECT_NAME}-web:prod
    ports: !reset []
    networks:
      - default
      - edge
    environment:
      # After SIGTERM the old container keeps serving this long (scripts/web-start.sh): Traefik routes only to healthy
      # containers and drops one when it exits, a couple of seconds after the event (ADR 0044).
      RADAR_DRAIN_SECONDS: "5"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
    # Changing any traefik.* label below costs a few seconds of 404 on that one deploy: while the old and the new
    # container both run, Traefik sees the router defined twice, differently, and drops it (ADR 0044).
    labels:
      traefik.enable: "true"
      traefik.docker.network: reforesta-radar-edge
      # http: only a redirect to https (middleware defined by Dokploy in /etc/dokploy/traefik/dynamic/middlewares.yml)
      traefik.http.routers.reforesta-radar-http.rule: Host(`${RADAR_DOMAIN}`)
      traefik.http.routers.reforesta-radar-http.entrypoints: web
      traefik.http.routers.reforesta-radar-http.middlewares: redirect-to-https@file
      # https with a Let's Encrypt certificate (ACME account without e-mail, deploy/traefik.yml)
      traefik.http.routers.reforesta-radar.rule: Host(`${RADAR_DOMAIN}`)
      traefik.http.routers.reforesta-radar.entrypoints: websecure
      traefik.http.routers.reforesta-radar.tls.certresolver: letsencrypt
      traefik.http.routers.reforesta-radar.middlewares: reforesta-radar-retry,reforesta-radar-headers
      traefik.http.services.reforesta-radar.loadbalancer.server.port: "3000"
      # A request that cannot reach a `web` container (refused: it has just exited during a deploy and Traefik still
      # lists it) goes to the other one. Only on a network error before any answer, never on an HTTP error status.
      traefik.http.middlewares.reforesta-radar-retry.retry.attempts: "3"
      traefik.http.middlewares.reforesta-radar-retry.retry.initialInterval: 100ms
      # HSTS here (it belongs to the https edge); the other security headers come from next.config.ts, so the
      # app's stricter values on /autorizar and the link pages are never overwritten. An empty value removes it.
      traefik.http.middlewares.reforesta-radar-headers.headers.stsSeconds: "31536000"
      # nosniff is the same everywhere, and Next's header rules do not reach the /api/* responses it proxies.
      traefik.http.middlewares.reforesta-radar-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.reforesta-radar-headers.headers.customResponseHeaders.Server: ""
      traefik.http.middlewares.reforesta-radar-headers.headers.customResponseHeaders.X-Powered-By: ""
    deploy: *limits-small
    logging: *logging

networks:
  default:
    ipam:
      config:
        - subnet: ${RADAR_NET_SUBNET:-172.28.90.0/24}
  # Only `web` and Traefik: other projects on Dokploy's shared network cannot reach the radar.
  edge:
    name: reforesta-radar-edge
    external: true
